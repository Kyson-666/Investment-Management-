# 两种用法：
#   1) 直接用预构建镜像（推荐）：docker compose pull && docker compose up -d
#   2) 本地构建：docker compose up -d --build
# 镜像来源可切换（默认 ghcr.io）：
#   IMAGE=kyson666/investment-management docker compose up -d
services:
  app:
    build: .
    image: "${IMAGE:-ghcr.io/kyson-666/investment-management:latest}"
    container_name: investment-manager
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      # SQLite 数据库、自动备份、导入前备份全部落在 ./data，容器重建不丢数据
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=8080
      # 留空即由服务自动生成随机密钥并持久化到 data/.jwt-secret（首次启动写入，重建容器不变）。
      # 多实例共享数据卷或需固定密钥时，请在 .env 中显式设置 32 位以上随机值。
      - JWT_SECRET=${JWT_SECRET:-}
      - CONFIG_SECRET=${CONFIG_SECRET:-}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@example.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin12345}
      - DB_PATH=/app/data/invest.db
      - FX_SOURCE_URL=${FX_SOURCE_URL:-https://api.frankfurter.app/latest?from=USD&to=CNY}
      - FX_FALLBACK_URL=${FX_FALLBACK_URL:-https://open.er-api.com/v6/latest/USD}
      - FX_SYNC_CRON=${FX_SYNC_CRON:-0 8 * * *}
      - FX_SYNC_ON_START=${FX_SYNC_ON_START:-false}
      - QUOTES_STOCK_CRON=${QUOTES_STOCK_CRON:-*/15 * * * *}
      - QUOTES_FUND_CRON=${QUOTES_FUND_CRON:-5 21 * * *}
      # 定时任务总开关（false 可关闭汇率/行情同步、月末快照、基准点位、定投、预警、备份）
      - CRON_ENABLED=${CRON_ENABLED:-true}
      # 自动备份保留天数
      - BACKUP_KEEP_DAYS=${BACKUP_KEEP_DAYS:-30}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_SECURE=${SMTP_SECURE:-true}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - TZ=${TZ:-Asia/Shanghai}
    restart: unless-stopped
