name: CI / Publish Docker image

# 触发：
#   1) 推送 v*.*.* tag（标准发布路径）
#   2) 手动 workflow_dispatch（可指定 image_tag，用于重建某版本或修正 latest）
# ⚠️ 发布时只推当前这一个 tag，切勿 `git push --tags`
#    —— 每个 v*.*.* tag 都会同时打 latest，多个 tag 并发会让 latest 指向「最后完成的旧版本」。
on:
  push:
    branches: [main]
    tags:
      - 'v*.*.*'
  pull_request:
  workflow_dispatch:
    inputs:
      image_tag:
        description: '镜像 tag（如 v1.0.0）；留空则用 run number 生成临时 tag'
        required: false
        default: ''

jobs:
  test:
    name: Test & build
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            web/package-lock.json

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Server tests + caliber gate
        working-directory: server
        run: npm test

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Web build
        working-directory: web
        run: npm run build

  push_to_registries:
    name: Push Docker image to registries
    needs: test
    # 只有 tag 或手动触发才发布；main 分支 push / PR 只跑测试
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    # ⚠️ secrets 不能在步骤级 if 里直接引用（会报 Unrecognized named-value: 'secrets'），
    #    必须先注入 job 级 env，再用 if: ${{ env.X != '' }} 判断。
    env:
      IMAGE_NAME: investment-management
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Resolve version tag
        id: ver
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          elif [ -n "${{ inputs.image_tag }}" ]; then
            TAG="${{ inputs.image_tag }}"
          else
            TAG="v0.0.0-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "版本 tag = ${TAG}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      # 显式拼装镜像名：仓库名 "Investment-Management-" 含大写与结尾连字符，不是合法的
      # Docker 镜像名（须匹配 [a-z0-9]+([._-][a-z0-9]+)*），因此不能用 ${{ github.repository }}。
      - name: Compose image tags
        id: tags
        run: |
          GHCR="ghcr.io/${GITHUB_REPOSITORY_OWNER}/${IMAGE_NAME}"
          TAGS="${GHCR}:${{ steps.ver.outputs.tag }}"
          TAGS="${TAGS}"$'\n'"${GHCR}:latest"
          if [ -n "${DOCKERHUB_USERNAME}" ] && [ -n "${DOCKERHUB_TOKEN}" ]; then
            TAGS="${TAGS}"$'\n'"${DOCKERHUB_USERNAME}/${IMAGE_NAME}:${{ steps.ver.outputs.tag }}"
            TAGS="${TAGS}"$'\n'"${DOCKERHUB_USERNAME}/${IMAGE_NAME}:latest"
          else
            echo "::warning::未配置 DOCKERHUB_USERNAME / DOCKERHUB_TOKEN，本次仅推送 ghcr.io"
          fi
          {
            echo 'list<<EOF'
            echo "${TAGS}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          echo "本次将推送："
          echo "${TAGS}"

      - name: Build and push Docker images
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish summary
        run: |
          {
            echo "## 🐳 镜像发布完成"
            echo ""
            echo "| 注册表 | 镜像 |"
            echo "|---|---|"
            echo "| GHCR | \`ghcr.io/${GITHUB_REPOSITORY_OWNER}/${IMAGE_NAME}:${{ steps.ver.outputs.tag }}\` |"
            echo "| Docker Hub | \`${DOCKERHUB_USERNAME:-<未配置>}/${IMAGE_NAME}:${{ steps.ver.outputs.tag }}\` |"
            echo ""
            echo "架构：\`linux/amd64\`、\`linux/arm64\`；\`latest\` 已同步指向本次构建。"
          } >> "$GITHUB_STEP_SUMMARY"
